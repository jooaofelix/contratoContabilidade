<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/relatorios.css">
</head>
<body>
<header class="app-header">
  <div class="app-brand">
    <img src="assets/aea-logo.svg" alt="AEA Contabilidade Consultiva" class="app-logo">
    <h1>Relatórios</h1>
  </div>
  <nav class="app-nav">
    <a href="index.html">Início</a>
    <a href="contrato.html">Contrato</a>
    <a href="orcamento.html">Orçamento</a>
    <a href="ficha.html">Ficha Cadastral</a>
    <a href="processo.html">Ficha de Processo</a>
    <a href="vendas.html">Vendas</a>
    <a href="historico.html">Histórico</a>
    <a href="relatorios.html" class="active">Relatórios</a>
  </nav>
</header>

<div class="app-layout">

  <aside class="sidebar">
    <section class="panel">
      <h2>📅 Período</h2>
      <div class="panel-body">
        <div class="row">
          <label>De
            <input type="date" id="rel_de">
          </label>
          <label>Até
            <input type="date" id="rel_ate">
          </label>
        </div>
        <div class="row">
          <button id="rel_mesAtual" class="btn-secondary">Mês atual</button>
          <button id="rel_mesAnterior" class="btn-secondary">Mês anterior</button>
        </div>
        <button id="rel_atualizar" class="btn-primary">Atualizar relatório</button>
        <div id="rel_status" class="pdf-status"></div>
      </div>
    </section>

    <div class="actions">
      <button id="btn-print" class="btn-primary">Imprimir / Exportar PDF</button>
    </div>
  </aside>

  <main class="preview-wrap">
    <div id="relatorio-preview" class="relatorio-doc"></div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/empresas-store.js"></script>
<script src="js/app-relatorios.js"></script>
</body>
</html>
